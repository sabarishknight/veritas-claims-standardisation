# ---------------------------------------------------------------------------
# Canonical test catalogue  (FR-2.1 name normalisation, FR-3.1/3.2 validation)
#
# One entry per canonical test. Everything the pipeline knows about a test is
# here; adding a test or an alias is a config change, never a code change
# (NFR-2.1).
#
# FIELDS
#   canonical       Output value of `test_name_canonical`. Stable - downstream
#                   marts join on it, so renaming one is a breaking change.
#   loinc           LOINC code, for interoperability with payor systems.
#                   INDICATIVE ONLY - see docs/assumptions.md D-7: these were
#                   hand-assigned and must be validated against the official
#                   LOINC release before production use.
#   panel           Grouping for the ops UI and for panel-level completeness.
#   dimension       Must match a dimension in units.yaml. This is the safety
#                   check: a row whose unit is of a different dimension is
#                   quarantined, not converted.
#   canonical_unit  Output value of `unit_canonical`; must belong to dimension.
#   value_type      numeric | qualitative | compound | narrative
#   reference_ranges Ordered; first match on sex wins, `ANY` is the fallback.
#                   Ranges are adult values unless noted (see D-4: paediatric
#                   ranges are out of scope and the sample patients include a
#                   16 kg child, so some flags will be false positives).
#   plausible       Hard physiological bounds. OUTSIDE = Outlier (FR-3.2),
#                   which is a *different* finding from Above/Below Range: one
#                   is a sick patient, the other is bad data. Conflating them
#                   is how a haemoglobin of 999 reaches an adjudication rule.
#   aliases         Verbatim spellings observed in source traffic. Resolved by
#                   exact match at tier T0 with confidence 1.0.
#
# DELIBERATELY NOT ALIASED
#   The OCR-cropped spellings in Sample_JSON_file2 (`aemoglobin`, `atelet
#   Count`, `eutrophils`) are absent on purpose. Hard-coding them would mask
#   the defect: those rows are also value-misaligned, and we want the fuzzy
#   tier to resolve the name at reduced confidence and the coherence engine to
#   reject the row. See docs/data-profile.md F-1.
# ---------------------------------------------------------------------------
version: 7

defaults:
  value_type: numeric
  outlier_sigma: 6.0        # robust z-score fallback when no `plausible` given

