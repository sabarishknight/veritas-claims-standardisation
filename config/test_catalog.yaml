# ---------------------------------------------------------------------------
# Rows whose `test_name` is not a test at all. Matching one of these patterns
# routes the row to the dead-letter store with a precise reason instead of
# polluting the review queue with noise an analyst cannot action.
# ---------------------------------------------------------------------------
non_test_patterns:
  - pattern: "^(test_name|result|range|unit|page_no)$"
    reason: header_row_leaked
  - pattern: "^Comment$"
    reason: narrative_comment
  - pattern: "^(DIAGNOSTICS|BIOCHEMICAL EXAMINATION|CENTRIFUGED SEDIMENT WET MOUNT AND MICROSCOPY)$"
    reason: section_heading
  # Panel names, not analytes. Left unmatched they fuzzy-resolve to whichever
  # member test they most resemble, and the value printed beside the heading -
  # which belongs to the panel's first analyte - is then attributed to the
  # wrong test. Naming them explicitly is what turns that silent error into a
  # dead-letter row with the reason `panel_heading`.
  - pattern: "^(COMPLETE BLOOD COUNT|CBC)\\b"
    reason: panel_heading
  - pattern: "^(DIFFERENTIAL LEUCOCYTIC COUNT|DIFFERENTIAL LEUKOCYTE COUNTS?|DIFFERENTIAL COUNT)\\b"
    reason: panel_heading
  - pattern: "^(RBC INDICES|PLATELET INDICES|RED CELL INDICES)\\b"
    reason: panel_heading
  - pattern: "^(LIVER FUNCTION TEST|LFT)\\b.*(SERUM|\\(LFT\\)|TEST)"
    reason: panel_heading
  - pattern: "^(RENAL PROFILE|KIDNEY FUNCTION TEST|RFT|KFT)\\s*[/(]"
    reason: panel_heading
  - pattern: "^(COMPLETE URINE EXAMINATION|CUE)\\b"
    reason: panel_heading
  - pattern: "^(WIDAL TEST \\(SLIDE METHOD\\))$"
    reason: panel_heading
  - pattern: "^(NEGATIVE|ABSENT|POSITIVE|NIL|PRESENT)$"
    reason: value_in_name_column
  - pattern: "Patient Name:"
    reason: pii_header_leaked
  - pattern: "^(USG|ULTRASOUND|X-?RAY|CT |MRI |ECG|ECHO)"
    reason: imaging_narrative
  - pattern: "^CULTURE AND SENSITIVITY"
    reason: microbiology_narrative
