  # --- Absolute differential counts -----------------------------------------
  # Labs report the differential either as a percentage or as an absolute count
  # per unit volume, and they use *the same name* for both: "NEUTROPHILS" with
  # unit "%" is a proportion, "NEUTROPHILS" with unit "cells/cu.mm" is an
  # absolute count. They are different tests with different reference ranges,
  # and conflating them puts a 2230.8 next to a 52 in the same column.
  #
  # These entries share their aliases with the PERCENT entries above. The
  # resolver disambiguates on the row's unit dimension (see
  # standardise/names.py, `unit_hint`), which is the only evidence that can
  # settle it. With no unit the PERCENT entry wins, because the percentage form
  # is overwhelmingly the more common report style.
  - canonical: ABSOLUTE NEUTROPHIL COUNT
    loinc: "751-8"
    panel: DLC
    dimension: count_per_volume
    canonical_unit: "cells/cu.mm"
    reference_ranges: [{sex: ANY, low: 1800.0, high: 7700.0}]
    plausible: {low: 0.0, high: 100000.0}
    aliases: ["NEUTROPHILS", "Neutrophils", "Neutrophil", "ABSOLUTE NEUTROPHIL COUNT",
              "ANC", "Absolute Neutrophil Count"]

